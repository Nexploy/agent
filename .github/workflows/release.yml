name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare platform tag
        id: platform
        run: echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
        env:
          platform: ${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=nexploy/agent,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=agent-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=agent-${{ steps.platform.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  images:
    name: Publish agent
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nexploy/agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'nexploy/agent@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect nexploy/agent:${{ steps.meta.outputs.version }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: nexploy/agent
          readme-filepath: DOCKERHUB.md

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # The tag decides what gets published. package.json is aligned to it here so
      # a forgotten version bump cannot publish the wrong number, or fail on a
      # version that is already on the registry.
      - name: Read the version from the tag
        id: version
        env:
          GIT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${GIT_TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GIT_TAG is not a semver version."
            exit 1
          fi
          if npm view "@nexploy/agent@$version" version --silent >/dev/null 2>&1; then
            echo "::error::@nexploy/agent@$version is already published. Tag a new version."
            exit 1
          fi
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "::notice::package.json says $declared, publishing $version from the tag."
          fi
          case "$version" in
            *-*) echo "npm_tag=next" >>"$GITHUB_OUTPUT" ;;
            *)   echo "npm_tag=latest" >>"$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Align package.json with the tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm publish --provenance --tag ${{ steps.version.outputs.npm_tag }}

  release:
    name: GitHub release
    needs: [images, npm]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tags
        id: tags
        env:
          GIT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "git=${GIT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${GIT_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.image }}
        run: |
          {
            echo "# Nexploy agent ${IMAGE_TAG}"
            echo
            echo "## Docker image"
            echo
            echo '```'
            echo "docker pull nexploy/agent:${IMAGE_TAG}"
            echo '```'
            echo
            echo "## npm package"
            echo
            echo '```'
            echo "npm install @nexploy/agent@${IMAGE_TAG}"
            echo '```'
            echo
            echo "## Install on the target Docker host"
            echo
            echo '```bash'
            echo "docker run -d \\"
            echo "  --name nexploy-agent \\"
            echo "  --restart unless-stopped \\"
            echo "  -e NEXPLOY_URL=https://nexploy.example.com \\"
            echo "  -e NEXPLOY_AGENT_TOKEN=nxa_xxx \\"
            echo "  -v /var/run/docker.sock:/var/run/docker.sock \\"
            echo "  nexploy/agent:${IMAGE_TAG}"
            echo '```'
            echo
            echo "Generate the token in Nexploy when creating an Agent environment."
          } > /tmp/release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tags.outputs.git }}
          body_path: /tmp/release-notes.md
          generate_release_notes: true
