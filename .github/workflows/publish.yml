name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # The tag decides what gets published. package.json is aligned to it here so
      # a forgotten version bump cannot publish the wrong number, or fail on a
      # version that is already on the registry.
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semver version."
            exit 1
          fi
          if npm view "@nexploy/agent@$version" version --silent >/dev/null 2>&1; then
            echo "::error::@nexploy/agent@$version is already published. Tag a new version."
            exit 1
          fi
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "::notice::package.json says $declared, publishing $version from the tag."
          fi
          case "$version" in
            *-*) echo "npm_tag=next" >>"$GITHUB_OUTPUT" ;;
            *)   echo "npm_tag=latest" >>"$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Align package.json with the tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm publish --provenance --tag ${{ steps.version.outputs.npm_tag }}
